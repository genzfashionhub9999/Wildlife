DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOIDMEN™</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial}
header{text-align:center;padding:35px;background:linear-gradient(#000,#111)}
h1{font-size:50px;letter-spacing:6px;margin:0}
input{width:85%;padding:14px;border-radius:30px;border:none;margin-top:15px}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:15px}
button{padding:10px 18px;border:none;border-radius:25px;background:#222;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;padding:18px}
.card{background:#151515;border-radius:18px;overflow:hidden}
.card img{width:100%;height:230px;object-fit:cover}
.info{padding:12px}
.buy{background:#fff;color:#000;width:100%;padding:10px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>VOIDMEN™</h1>
<p>Wear the Future</p>
<input id="search" placeholder="Search Products">
</header>

<nav>
<button onclick="filterCat('All')">All</button>
<button onclick="filterCat('T-Shirt')">T-Shirts</button>
<button onclick="filterCat('Jeans')">Jeans</button>
<button onclick="filterCat('Hoodie')">Hoodies</button>
<button onclick="filterCat('Sweatshirt')">Sweatshirts</button>
</nav>

<div id="products" class="grid"></div>

<script>
const products=[];

function add(cat,count,price){
 for(let i=1;i<=count;i++){
   products.push({
    name:cat+" "+i,
    category:cat,
    price:price+i,
    img:"https://picsum.photos/400/500?random="+(products.length+1)
   });
 }
}

add("T-Shirt",100,200);
add("Jeans",100,300);
add("Hoodie",100,250);
add("Sweatshirt",100,250);

const grid=document.getElementById("products");

function show(list){
 grid.innerHTML="";
 list.forEach(p=>{
  grid.innerHTML+=`
  <div class="card">
   <img src="${p.img}">
   <div class="info">
    <h3>${p.name}</h3>
    <p>₹${p.price}</p>
    <p>Payment: Online Only</p>
    <button class="buy"
    onclick="alert('Online Payment Only (UPI/Card)\\nCash on Delivery Not Available');">
    Buy Now
    </button>
   </div>
  </div>`;
 });
}

show(products);

function filterCat(c){
 if(c==="All") show(products);
 else show(products.filter(x=>x.category===c));
}

search.oninput=e=>{
 let t=e.target.value.toLowerCase();
 show(products.filter(x=>x.name.toLowerCase().includes(t)));
}
</script>

</body>
</html>
